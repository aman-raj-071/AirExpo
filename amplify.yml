version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm install --global pnpm@10.28.2 --force
        - pnpm --version
        - pnpm install --frozen-lockfile --store-dir .pnpm-store
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
